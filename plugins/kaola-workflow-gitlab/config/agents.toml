[agents.adversarial-verifier]
description = "Adversarial verifier for one recorded claim and surface, using strongest falsification with uncertainty counting against the claim."
config_file = "./agents/kaola-workflow/adversarial-verifier.toml"
nickname_candidates = ["Adversary", "Refuter", "Breaker"]

[agents.build-error-resolver]
description = "Build and TypeScript error resolution specialist. Use PROACTIVELY when build fails or type errors occur. Fixes build/type errors only with minimal diffs, no architectural edits. Focuses on getting the build green quickly."
config_file = "./agents/kaola-workflow/build-error-resolver.toml"

[agents.code-architect]
description = "Designs feature architectures by analyzing existing codebase patterns and conventions, then providing implementation blueprints with concrete files, interfaces, data flow, and build order."
config_file = "./agents/kaola-workflow/code-architect.toml"

[agents.code-explorer]
description = "Deeply analyzes existing codebase features by tracing execution paths, mapping architecture layers, and documenting dependencies to inform new development."
config_file = "./agents/kaola-workflow/code-explorer.toml"

[agents.code-reviewer]
description = "Precision-first code review specialist for correctness, regression, scope, maintainability, and test coverage."
config_file = "./agents/kaola-workflow/code-reviewer.toml"
nickname_candidates = ["Reviewer", "Critic", "Inspector"]

[agents.doc-updater]
description = "Documentation and codemap specialist. Use PROACTIVELY for updating codemaps and documentation. Runs /update-codemaps and /update-docs, generates docs/CODEMAPS/*, updates READMEs and guides."
config_file = "./agents/kaola-workflow/doc-updater.toml"

[agents.implementer]
description = "The implementing role. Writes production code for behavioral logic and for work with no natural failing test alike — refactors, scaffolding, config/IaC, UI, migrations, glue — reading and running acceptance tests while preserving their meaning; may perform only mechanical test-path maintenance when explicitly needed."
config_file = "./agents/kaola-workflow/implementer.toml"

[agents.investigator]
description = "Read-only investigation specialist for work that must RUN to be known — builds, tests, reproductions, measurements, bisects, and A/B legs. Produces recorded measurements, never edits tracked files, never chooses the fix."
config_file = "./agents/kaola-workflow/investigator.toml"

[agents.knowledge-lookup]
description = "Authoritative external-knowledge researcher for facts the local codebase cannot establish."
config_file = "./agents/kaola-workflow/knowledge-lookup.toml"

[agents.metric-optimizer]
description = "Bounded metric-ratchet specialist for direction-not-destination work — proposes a change, applies it, runs the regression gate, measures the metric (median-of-K), and accepts or rejects it by comparing to the running baseline, iterating until a stop condition fires."
config_file = "./agents/kaola-workflow/metric-optimizer.toml"

[agents.planner]
description = "Expert planning specialist for complex features and refactoring. Use PROACTIVELY when users request feature implementation, architectural changes, or complex refactoring. Automatically activated for planning tasks."
config_file = "./agents/kaola-workflow/planner.toml"

[agents.security-reviewer]
description = "Security vulnerability detection specialist. Use PROACTIVELY after writing code that handles user input, authentication, API endpoints, or sensitive data. Flags secrets, SSRF, injection, unsafe crypto, and OWASP Top 10 vulnerabilities, then routes fixes to the appropriate role."
config_file = "./agents/kaola-workflow/security-reviewer.toml"
nickname_candidates = ["Security", "Audit", "Threat"]

[agents.synthesizer]
description = "Write-convergence specialist — reconciles concurrent write branches into the feature branch by INTENT when a mechanical merge hits a real conflict. Reasoning-class; never invoked for cleanly-disjoint work (that merges mechanically, no agent)."
config_file = "./agents/kaola-workflow/synthesizer.toml"

[agents.tdd-guide]
description = "Test author. Holds custody of the test artifact — authors the suite from the acceptance surface, proves it fails on the recorded baseline, and never writes production code. Use PROACTIVELY for new behavior, bug fixes, and any work whose correctness needs an oracle."
config_file = "./agents/kaola-workflow/tdd-guide.toml"
